# EvalDetectBench on Hawk via OpenRouter: 20-sample smoke run for both judges.
# Both names are pinned snapshots from `hawk models`. GPT-4.1 via OpenRouter is
# the paper's own route; Haiku went direct in the paper (see README).
#   hawk eval-set run hawk/openrouter-smoke.eval-set.yaml
name: edb-or-smoke
tasks:
  - package: "git+https://github.com/chahal-navi/eval-detect-bench@90498bf6a6497b14d108b0c3c588b0593f3212aa"
    name: eval_detect_bench
    items:
      - name: eval_detect_bench
models:
  - package: openai
    name: openai
    items:
      - name: openrouter/openai/gpt-4.1-2025-04-14
      - name: openrouter/anthropic/claude-4.5-haiku-20251001
limit: 20
epochs: 1
max_retries: 5
runner:
  cpu: "1"
  memory: 4Gi
